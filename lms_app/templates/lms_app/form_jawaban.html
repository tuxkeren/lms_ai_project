{% extends 'lms_app/base.html' %}

{% block judul %}Jawab Soal - LMS AI{% endblock %}

{% block konten %}
    <div class="max-w-2xl mx-auto">
        <h1 class="text-xl font-bold text-gray-900 mb-1">Ujian: {{ soal.ujian.judul }}</h1>
        <p class="text-sm text-gray-500 mb-6">{{ soal.ujian.kursus.nama|default:"" }}</p>

        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
            <p class="font-semibold text-gray-900 mb-1">Pertanyaan:</p>
            <p class="text-gray-800">{{ soal.teks_soal }}</p>
        </div>

        <form method="POST" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            {% csrf_token %}
            <label for="teks_jawaban" class="block font-semibold text-gray-900 mb-2">Jawaban Anda:</label>
            <textarea name="teks_jawaban" id="teks_jawaban"
                      placeholder="Ketik jawaban Anda di sini..."
                      class="w-full h-40 px-3 py-2 border border-gray-300 rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      required></textarea>
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-md transition">Kirim Jawaban</button>
        </form>
    </div>
{% endblock %}
